<style>
/* Layout: banco di lavoro. Barra in alto, foglio tecnico a sinistra, scheda valori a destra (impilati su telefono). */
:root{
  --bg:#e8ecef; --sheet:#fbfcfd; --ink:#1a2127; --muted:#5d6973; --rule:#d0d7dc;
  --line:#4b5761; --partfill:#dfe5e9;
  --ok:#2b8a3e; --okfill:rgba(55,178,77,.34);
  --sel:#d9302c; --selfill:rgba(217,48,44,.14);
  --warn:#c2410c; --warnfill:rgba(234,120,40,.30); --warnbg:#fff0e4;
  --accent:#1d5a85; --accentbg:#e2edf5; --stage:#d5dde4;
  --btn:#1a2127; --btnfg:#fbfcfd; --onsolid:#ffffff; --bar:#0e3a63; --barfg:#eef4fa;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161a; --sheet:#192026; --ink:#e4e9ed; --muted:#97a3ad; --rule:#2c363e;
    --line:#a3afb9; --partfill:#27313a;
    --ok:#51cf66; --okfill:rgba(81,207,102,.30);
    --sel:#ff6b6b; --selfill:rgba(255,107,107,.16);
    --warn:#ff9a4d; --warnfill:rgba(255,154,77,.28); --warnbg:#2c1f15;
    --accent:#74b4e3; --accentbg:#16293a; --stage:#0c1116;
    --btn:#e4e9ed; --btnfg:#11161a; --onsolid:#0d1114; --bar:#0b2742; --barfg:#e4edf5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161a; --sheet:#192026; --ink:#e4e9ed; --muted:#97a3ad; --rule:#2c363e;
  --line:#a3afb9; --partfill:#27313a;
  --ok:#51cf66; --okfill:rgba(81,207,102,.30);
  --sel:#ff6b6b; --selfill:rgba(255,107,107,.16);
  --warn:#ff9a4d; --warnfill:rgba(255,154,77,.28); --warnbg:#2c1f15;
  --accent:#74b4e3; --accentbg:#16293a; --stage:#0c1116;
  --btn:#e4e9ed; --btnfg:#11161a; --onsolid:#0d1114; --bar:#0b2742; --barfg:#e4edf5;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--barfg)}
@media (max-width:480px){.logo span{display:none}.logo b{font-size:20px}}
.top-in{max-width:1240px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;color:inherit}
.logo svg{width:30px;height:30px}
.logo b{font-family:var(--f-display);font-size:22px;letter-spacing:.02em;text-transform:uppercase}
.logo span{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;opacity:.7;text-transform:uppercase}
.status{margin-left:auto;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:7px;opacity:.9}
.status i{width:8px;height:8px;border-radius:50%;background:#8a96a0;display:inline-block}
.status.ok i{background:#51cf66}.status.slow i,.status.loading i{background:#fcc419}.status.off i,.status.error i{background:#ff6b6b}

.wrap{max-width:1240px;margin:0 auto;padding-block:18px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.crumbs button{background:none;border:0;padding:4px 2px;cursor:pointer;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;font-family:var(--f-mono);font-size:12px}
.crumbs button:hover{text-decoration:underline}
.crumbs .sep{opacity:.5}
.crumbs .cur{color:var(--ink)}

.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;justify-content:space-between}
.head h1{font-size:clamp(30px,5vw,44px);text-transform:uppercase;letter-spacing:.01em}
.head p{color:var(--muted);max-width:62ch}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}

.search{position:relative;width:min(100%,320px)}
.search input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}

.brands{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.brand{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:14px;min-height:96px;padding:14px;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;cursor:pointer;text-align:left;transition:border-color .15s,transform .15s}
.brand:hover{border-color:var(--accent);transform:translateY(-1px)}
.brand .bn{overflow-wrap:anywhere;font-family:var(--f-display);font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.brand .bc{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
.brand.empty .bn{color:var(--muted)}
.brand.has{border-color:var(--ink)}
.brand.has .bc{color:var(--ok)}

.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.note{padding:16px;border-radius:10px;background:var(--accentbg);display:flex;flex-direction:column;gap:6px}
.note h3{font-size:19px;text-transform:uppercase}
.note p{font-size:15px}
.note.demo{background:var(--warnbg)}
.note button{align-self:flex-start;margin-top:6px}

.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.car{display:flex;flex-direction:column;gap:8px;padding:14px;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;cursor:pointer;text-align:left;transition:border-color .15s,transform .15s}
.car:hover{border-color:var(--accent);transform:translateY(-1px)}
.car svg{width:100%;height:auto;max-width:100%;aspect-ratio:200/80}
.car svg .cb{fill:var(--partfill);stroke:var(--line);stroke-width:1.6}
.car svg .cw{fill:var(--sheet);stroke:var(--line);stroke-width:1.6}
.car svg .cl{fill:none;stroke:var(--line);stroke-width:1.2}
.car .cn{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1;text-transform:uppercase}
.car .cs{font-size:14px;color:var(--muted)}
.meter{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.meter .bar{flex:1;height:5px;border-radius:3px;background:var(--partfill);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--ok)}
.car.add{align-items:center;justify-content:center;border-style:dashed;color:var(--accent);font-weight:600;min-height:150px}
.car.add .plus{font-family:var(--f-display);font-size:40px;line-height:1}

.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.wide{grid-column:1/-1}
.field label{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field input,.field textarea{width:100%;padding:10px 11px;border:1px solid var(--rule);border-radius:7px;background:var(--bg)}
.field textarea{min-height:84px;resize:vertical}
.field small{font-size:13px;color:var(--muted)}
.field input:focus,.field textarea:focus,.search input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.err{color:var(--sel);font-size:14px;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:7px;border:1px solid var(--btn);background:var(--btn);color:var(--btnfg);font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.danger{background:var(--sel);border-color:var(--sel);color:var(--onsolid)}
.btn.link{background:none;border:0;padding:6px 0;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.vehicle{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline}
.spec{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.banner{padding:12px 14px;border-radius:8px;background:var(--warnbg);color:var(--ink);border-left:4px solid var(--warn);font-size:15px}
.banner b{color:var(--warn)}

.systems{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.sys{display:flex;flex-direction:column;gap:8px;padding:12px;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;cursor:pointer;text-align:left;transition:border-color .15s,transform .15s}
.sys:hover{border-color:var(--accent);transform:translateY(-1px)}
.sys .tn{font-family:var(--f-display);font-size:22px;font-weight:700;text-transform:uppercase;line-height:1}
.sys .td{font-size:14px;color:var(--muted)}
.sys .thumbbox{background:var(--bg);border-radius:6px;padding:6px}

.work{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:880px){.work{grid-template-columns:minmax(0,1fr)}}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;overflow:hidden;min-width:0}
.sheet-draw{padding:10px;border-bottom:1px solid var(--rule)}
.cart{display:grid;grid-template-columns:2fr 2fr 1fr;font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.cart div{padding:8px 10px;border-right:1px solid var(--rule);min-width:0;overflow-wrap:anywhere}
.cart div:last-child{border-right:0}
.cart span{display:block;color:var(--muted);font-size:10px}
.cart b{font-weight:700;color:var(--ink)}
@media (max-width:520px){.cart{grid-template-columns:1fr 1fr}.cart div:last-child{display:none}.cart div:nth-child(2){border-right:0}}

svg.draw{width:100%;height:auto;display:block}
svg.thumb{width:100%;height:auto;display:block;pointer-events:none}
svg .b{fill:var(--sheet);stroke:var(--line);stroke-width:2.2}
svg .l{fill:none;stroke:var(--line);stroke-width:1.5}
svg .d{fill:none;stroke:var(--line);stroke-width:1.3;stroke-dasharray:6 5}
svg .t{font-family:var(--f-mono);font-size:12px;font-weight:500;fill:var(--muted);letter-spacing:.1em}
svg .chain{fill:none;stroke:var(--line);stroke-width:9;stroke-dasharray:7 4}
svg .rail-o{fill:none;stroke:var(--line);stroke-width:18;stroke-linecap:round}
svg .rail{fill:none;stroke:var(--partfill);stroke-width:14;stroke-linecap:round}
svg .hose{fill:none;stroke:var(--line);stroke-width:7;stroke-linecap:round}
svg .solid{fill:var(--partfill);stroke:var(--line);stroke-width:2}
.pt > *{fill:var(--partfill);stroke:var(--line);stroke-width:1.8;transition:fill .15s,stroke .15s}
.pt > .in{fill:none}
.pt.has > *{fill:var(--okfill);stroke:var(--ok)}
.pt.ex > *,.pt.co > *{fill:var(--warnfill);stroke:var(--warn)}
.pt.has > .in,.pt.ex > .in,.pt.co > .in{fill:none}
.pt.sel > *{stroke:var(--sel);stroke-width:3.2}
.pt.sel:not(.has):not(.ex) > *{fill:var(--selfill)}
.draw .pt,.draw .mk{cursor:pointer}
.draw .pt:hover > *{stroke-width:3}
.pt:focus,.mk:focus{outline:none}
.pt:focus-visible > *{stroke:var(--accent);stroke-width:3.5}
.mk line{stroke:var(--muted);stroke-width:1.2}
.mk circle{fill:var(--sheet);stroke:var(--ink);stroke-width:1.8}
.mk text{font-family:var(--f-mono);font-size:var(--mkfs,14px);font-weight:700;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.mk.has circle{fill:var(--ok);stroke:var(--ok)}
.mk.has text,.mk.ex text,.mk.co text{fill:var(--onsolid)}
.mk.ex circle,.mk.co circle{fill:var(--warn);stroke:var(--warn)}
.mk.sel circle{stroke:var(--sel);stroke-width:3.5}
.mk.sel line{stroke:var(--sel);stroke-width:1.8}

.legend{display:flex;flex-wrap:wrap;gap:14px;padding:10px 12px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--rule)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--line);background:var(--partfill);display:inline-block}
.legend i.has{background:var(--okfill);border-color:var(--ok)}
.legend i.ex{background:var(--warnfill);border-color:var(--warn)}
.legend i.sel{background:transparent;border-color:var(--sel);border-width:2.5px}

.tablebox{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 12px;border-bottom:1px solid var(--rule);font-weight:500}
td{padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--bg)}
tbody tr.sel{background:var(--selfill)}
td.n{font-family:var(--f-mono);font-weight:700;width:44px}
td.v{font-family:var(--f-mono);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
td.v.none{color:var(--muted);font-weight:500}
td.v.has{color:var(--ok)}td.v.ex,td.v.co{color:var(--warn)}
@media (max-width:520px){th:nth-child(4),td:nth-child(4){display:none}td.v{white-space:normal}}
@media (max-width:600px){svg.draw{--mkfs:26px}}

.panel > .chip{align-self:flex-start}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;white-space:nowrap}
.chip.has{background:var(--okfill);color:var(--ink)}
.chip.ex,.chip.co{background:var(--warnfill);color:var(--ink)}
.chip.none{background:var(--partfill);color:var(--muted)}

.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
@media (max-width:880px){.side{position:static}}
.ph{display:flex;align-items:center;gap:12px}
.ph .num{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;border:2px solid var(--sel);color:var(--ink)}
.ph h2{font-size:26px;text-transform:uppercase}
.torque{font-family:var(--f-mono);font-weight:700;font-size:clamp(30px,4.4vw,42px);line-height:1.05;letter-spacing:-.01em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.torque.exv{color:var(--warn)}
.torque.long{font-size:clamp(20px,2.4vw,26px);line-height:1.25;letter-spacing:0}
.kv{display:flex;flex-direction:column;gap:3px}
.kv h3{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.pre{white-space:pre-wrap;overflow-wrap:anywhere}
.empty-state{color:var(--muted);display:flex;flex-direction:column;gap:8px}
.empty-state svg{width:44px;height:44px;stroke:var(--muted);fill:none;stroke-width:1.6}
.steps{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:st}
.step{width:100%;display:flex;gap:10px;align-items:flex-start;text-align:left;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--bg);cursor:pointer}
.step .ck{flex:none;width:20px;height:20px;border-radius:5px;border:2px solid var(--line);margin-top:2px;display:grid;place-items:center}
.step.done{opacity:.6}.step.done .ck{background:var(--ok);border-color:var(--ok)}
.step.done .ck::after{content:"";width:6px;height:10px;border:solid var(--onsolid);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.step.done span:last-child{text-decoration:line-through}
.src{display:inline-block;margin-top:4px;color:var(--accent);font-weight:600;text-decoration:none}
.src:hover{text-decoration:underline}
.missing{padding:14px;border:1.5px dashed var(--rule);border-radius:8px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:20;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
.foot{color:var(--muted);font-size:13px;border-top:1px solid var(--rule);padding-top:14px}
.status.local i{background:#51cf66}
button.vstrip.mine{width:100%;text-align:left;border:0;cursor:pointer;font:inherit}
button.vstrip.mine:hover{filter:brightness(1.08)}
td.v.wrap{white-space:normal}
tbody tr.nr{cursor:default}tbody tr.nr:hover{background:transparent}
.fgroup{display:flex;flex-direction:column;gap:10px}
.feats{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.feat{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.feat h3{font-size:18px;text-transform:uppercase}
.feat p{font-size:15px;color:var(--muted)}
ol.srcs{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
a.btn{text-decoration:none}
.v3d-slot{position:relative;width:100%;aspect-ratio:16/11;min-height:320px;max-height:78vh;border-radius:8px;overflow:hidden;background:#fdfdfd;border:1px solid #d9d9d9}
@media (max-width:600px){.v3d-slot{aspect-ratio:4/5;max-height:78vh}}
.v3d{position:absolute;inset:0}
.v3d canvas{width:100%!important;height:100%!important;display:block;touch-action:pan-y;cursor:grab;-webkit-tap-highlight-color:transparent}
.v3d canvas:active{cursor:grabbing}
.v3d-marks{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.mk3{position:absolute;left:0;top:0;pointer-events:auto;min-width:30px;height:30px;padding:0 9px;border-radius:15px;border:2px solid #141414;background:#fff;color:#141414;font:700 13px var(--f-mono);display:inline-flex;align-items:center;gap:6px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.25);white-space:nowrap}
.mk3 .nm{display:none;font-family:var(--f-body);font-weight:700;font-size:13px}

const key = (vid, sys, part) => `${vid}__${sys}__${part}`;
const refOf = (sys, part) => { const p = SYS[sys] && SYS[sys].parts.find(x => x.id === part); return p && p.ref ? p.ref : [sys, part]; };
const val = (vid, sys, part) => { const [a, b] = refOf(sys, part); return coppie.get(key(vid, a, b)); };
const vLabel = v => `${v.modello}${v.serie ? " (" + v.serie + ")" : ""}`;

const filledSys = (vid, sys) => SYS[sys].parts.filter(p => val(vid, sys, p.id)).length;
const stateOf = c => !c ? "none" : (c.esempio ? "ex" : c.community ? "co" : "has");
const chipOf = c => c && c.fonteUrl && !c.esempio && !c.community ? "off" : stateOf(c);

/* ---------- viste ---------- */
function crumbs() {
  const items = [`<button data-act="go" data-to="marche">Marche</button>`];
  const v = veicoli.get(S.vid);
  if (S.view !== "marche" && S.marca) items.push(S.view === "modelli" ? `<span class="cur">${esc(S.marca)}</span>` : `<button data-act="go" data-to="modelli">${esc(S.marca)}</button>`);
  if (["sistemi", "schema", "dati", "scheda", "funzioni"].includes(S.view) && v) items.push(S.view === "sistemi" ? `<span class="cur">${esc(vLabel(v))}</span>` : `<button data-act="go" data-to="sistemi">${esc(vLabel(v))}</button>`);
  if (S.view === "dati") items.push(`<span class="cur">Coppie di serraggio</span>`);
  if (S.view === "scheda") items.push(`<span class="cur">Dati tecnici</span>`);
  if (S.view === "funzioni") items.push(`<span class="cur">Funzioni e optional</span>`);
  if (S.view === "schema" && S.sys) items.push(`<span class="cur">${esc(SYS[S.sys].nome)}</span>`);
  return `<nav class="crumbs" aria-label="Percorso">${items.join('<span class="sep">›</span>')}</nav>`;
}

function viewMarche() {
  const counts = {};
  for (const v of veicoli.values()) if (!v.demo) counts[v.marca] = (counts[v.marca] || 0) + 1;
  const all = Object.keys(counts).sort((a, b) => a.localeCompare(b, "it"));
  const q = S.q.trim().toLowerCase();
  const list = all.filter(b => !q || b.toLowerCase().includes(q));
  const demo = [...veicoli.entries()].find(([, v]) => v.demo);
  const mine = [...veicoli.entries()].find(([, v]) => v.mia);
  return `
  <div class="head">
    <div><div class="eyebrow">Selezione veicolo</div><h1>Scegli la marca</h1>
    <p>Marca, modello, sistema: poi tocca il pezzo sul disegno e leggi coppia di serraggio, sequenza e fonte.</p></div>
    <div class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q-marca" type="search" placeholder="Cerca marca" aria-label="Cerca marca" value="${esc(S.q)}" autocomplete="off"></div>
  </div>
  <div class="brands">${list.map(b => {
    const n = counts[b] || 0;
    return `<button class="brand ${n ? "has" : "empty"}" data-act="marca" data-v="${esc(b)}"><span class="bn">${esc(b)}</span><span class="bc">${n ? n + (n === 1 ? " modello" : " modelli") : "nessun modello"}</span></button>`;
  }).join("") || `<p class="spec">Nessuna marca trovata per “${esc(S.q)}”.</p>`}
  ${q && !all.some(b => b.toLowerCase() === q) ? `<button class="brand empty" data-act="marca" data-v="${esc(S.q.trim())}"><span class="bn">+ ${esc(S.q.trim())}</span><span class="bc">aggiungi marca</span></button>` : ""}</div>
  ${mine ? `<button class="vstrip mine" data-act="veicolo" data-v="${esc(mine[0])}" data-m="${esc(mine[1].marca)}"><div class="vs-car">${CAR_SVG}</div><div class="vs-main"><span class="vs-mk">La mia auto · ${esc(mine[1].marca)}</span><b>${esc(vLabel(mine[1]))}</b><span class="vs-sp">${esc(mine[1].motore || "")}${mine[1].anni ? " · " + esc(mine[1].anni) : ""}</span></div><div class="vs-kpi"><b>${filledFor(mine[0])}</b><span>/${TOTAL_PARTS} valori</span></div><span class="btn ghost vs-btn">Apri</span></button>` : ""}
  <div class="info">
    ${demo ? `<div class="note demo"><h3>Guarda un esempio compilato</h3><p>Un veicolo di prova con i valori già inseriti, per vedere come funziona. I numeri sono inventati: non usarli su un'auto vera.</p><button class="btn" data-act="veicolo" data-v="${esc(demo[0])}" data-m="${esc(demo[1].marca)}">Apri l'esempio</button></div>` : ""}
    <div class="note"><h3>Da dove arrivano i valori</h3><p>Li inserisci tu, copiandoli dal manuale ufficiale della casa (portale riparazioni del costruttore), da un manuale Haynes o dalla documentazione dell'officina. Ogni valore porta con sé la fonte, così sai sempre da dove viene.</p></div>
    ${store.mode === "local"
      ? `<div class="note"><h3>Backup dei tuoi dati</h3><p>I valori restano salvati su questo dispositivo. Esporta un backup per non perderli o per passarli su un altro telefono, tablet o PC.</p><div class="row"><button class="btn" data-act="export">Esporta backup</button><button class="btn ghost" data-act="import">Importa backup</button></div></div>`
      : `<div class="note"><h3>Archivio condiviso</h3><p>Quello che salvi resta nell'archivio di questa pagina. Se la condividi con un collega, vede e può aggiungere gli stessi valori.</p></div>`}
  </div>`;
}

function viewModelli() {
  const list = [...veicoli.entries()].filter(([, v]) => v.marca === S.marca).sort((a, b) => (a[1].modello + a[1].serie).localeCompare(b[1].modello + b[1].serie, "it"));
  const cards = list.map(([id, v]) => {
    const n = filledFor(id), pct = Math.round(n / TOTAL_PARTS * 100);
    return `<button class="car" data-act="veicolo" data-v="${esc(id)}">${CAR_SVG}

function shellSheet() {

  const n = s.parts.indexOf(p) + 1, c = val(S.vid, S.sys, p.id), st = stateOf(c);
  return `<div class="sh-head"><span class="num">${n}</span><div class="sh-name">${esc(p.nome)}</div><button class="sh-x" data-act="close-part" aria-label="Chiudi">×</button></div>

function viewScheda() {
  const v = veicoli.get(S.vid);
  if (!v) return `<p class="spec">Veicolo non trovato.</p>`;
  const F = v.fontiDati || [];
  const okU = u => u && /^https:\/\//.test(u);
  const rows = (v.dati || []).map(r => `<tr class="nr"><td>${esc(r.k)}</td><td class="v has wrap">${esc(r.v)}</td><td class="fx">${F[r.f] && okU(F[r.f].u) ? `<a class="src" href="${esc(F[r.f].u)}" target="_blank" rel="noopener">[${r.f + 1}]</a>` : ""}</td></tr>`).join("");
  return `${vehStrip(v)}
  <div class="head"><div><div class="eyebrow">Dati tecnici</div><h1>Scheda tecnica</h1><p>Capacità, olio e intervalli presi dal manuale d'uso ufficiale. Il numero accanto a ogni valore apre la fonte.</p></div></div>
  <div class="sheet"><div class="tablebox"><table class="dt"><thead><tr><th>Voce</th><th>Valore</th><th>Fonte</th></tr></thead><tbody>${rows}</tbody></table></div></div>
  ${F.length ? `<div class="panel"><div class="eyebrow">Fonti</div><ol class="srcs">${F.map(f => `<li>${okU(f.u) ? `<a class="src" href="${esc(f.u)}" target="_blank" rel="noopener">${esc(f.t)} ↗</a>` : esc(f.t)}</li>`).join("")}</ol></div>` : ""}`;
}

function viewFunzioni() {
  const v = veicoli.get(S.vid);
  if (!v) return `<p class="spec">Veicolo non trovato.</p>`;
  const q = (S.fq || "").trim().toLowerCase(), groups = {};
  (v.funzioni || []).forEach(f => { (groups[f.g] = groups[f.g] || []).push(f); });
  const html = Object.entries(groups).map(([g, list]) => {
    const items = list.filter(f => !q || (f.n + " " + f.c).toLowerCase().includes(q)).map(f => `<div class="feat"><h3>${esc(f.n)}</h3><p>${esc(f.c)}</p></div>`).join("");
    return items ? `<section class="fgroup"><h2 class="h2">${esc(g)}</h2><div class="feats">${items}</div></section>` : "";
  }).join("");
  const src = v.fonteFunzioni, man = v.manuale, okU = u => u && /^https:\/\//.test(u);
  return `${vehStrip(v)}
  <div class="head"><div><div class="eyebrow">Il tuo veicolo</div><h1>Funzioni e optional</h1><p>Cosa fa ogni dotazione della tua versione. Per i comandi passo passo apri il manuale d'uso ufficiale.</p></div>
    <div class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q-funz" type="search" placeholder="Cerca funzione" aria-label="Cerca funzione" value="${esc(S.fq || "")}" autocomplete="off"></div></div>
  ${man && okU(man.u) ? `<div class="row"><a class="btn" href="${esc(man.u)}" target="_blank" rel="noopener">${esc(man.t)} ↗</a></div>` : ""}
  ${html || `<p class="spec">Nessun risultato.</p>`}
  ${src ? `<p class="foot">Fonte dotazioni: ${okU(src.u) ? `<a class="src" href="${esc(src.u)}" target="_blank" rel="noopener">${esc(src.t)}</a>` : esc(src.t)}</p>` : ""}`;
}

function viewDati() {
  const v = veicoli.get(S.vid);
  if (!v) return `<p class="spec">Veicolo non trovato.</p>`;
  const q = (S.dq || "").trim().toLowerCase();
  let total = 0, filled = 0;
  const groups = ORDER.map(k => {
    const s = SYS[k];
    const rows = s.parts.map((p, i) => {
      const c = val(S.vid, k, p.id); total++; if (c) filled++;
      if (S.onlyFilled && !c) return "";
      if (q && !(p.nome + " " + s.nome + " " + (c ? c.coppia : "")).toLowerCase().includes(q)) return "";
      return `<tr data-act="dato" data-s="${k}" data-v="${p.id}" tabindex="0"><td class="n">${i + 1}</td><td>${esc(p.nome)}</td><td class="v ${stateOf(c)}${c && c.coppia.length > 16 ? " wrap" : ""}">${c ? esc(c.coppia) : "—"}</td><td class="fx">${c && c.fasi ? esc(c.fasi.split("\n")[0]) : ""}</td><td>${chip(chipOf(c))}</td></tr>`;
    }).join("");
    return rows ? `<tbody><tr class="grp"><th colspan="5">${esc(s.nome)}</th></tr>${rows}</tbody>` : "";
  }).join("");
  return `${vehStrip(v)}
  <div class="head"><div><div class="eyebrow">Dati tecnici</div><h1>Coppie di serraggio</h1><p>Tutti i valori del veicolo, raggruppati per sistema. Tocca una riga per aprire il disegno.</p></div>
    <div class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q-dati" type="search" placeholder="Cerca componente" aria-label="Cerca componente" value="${esc(S.dq || "")}" autocomplete="off"></div></div>
  <div class="row"><label class="tog"><input type="checkbox" id="only-filled" ${S.onlyFilled ? "checked" : ""}> Solo valori inseriti</label><span class="spec">${filled}/${total} valori inseriti</span></div>
  <div class="sheet"><div class="tablebox"><table class="dt"><thead><tr><th>N°</th><th>Componente</th><th>Valore</th><th>Fasi</th><th>Stato</th></tr></thead>${groups || `<tbody><tr><td colspan="5" class="spec">Nessun risultato.</td></tr></tbody>`}</table></div></div>`;
}

function drawSvg(k, thumb) {
  const s = SYS[k];
  let parts = "", marks = "";
  const R = NARROW() ? 30 : 16;
  s.parts.forEach((p, i) => {
    const c = val(S.vid, k, p.id), st = stateOf(c);
    const sel = !thumb && S.part === p.id ? " sel" : "";
    const cls = (st === "none" ? "" : " " + st) + sel;
    if (thumb) { parts += `<g class="pt${cls}">${p.shape}</g>`; return; }
    const lbl = `${i + 1}. ${p.nome}${c ? ": " + c.coppia : ", valore mancante"}`;
    const dl = S.animate ? ` style="animation-delay:${(0.55 + i * 0.14).toFixed(2)}s"` : "";
    parts += `<g class="pt${cls}"${dl} data-act="part" data-v="${p.id}" tabindex="0" role="button" aria-label="${esc(lbl)}">${p.shape}</g>`;
    marks += `<g class="mk${cls}"${dl} data-act="part" data-v="${p.id}" aria-hidden="true"><line x1="${p.label[0]}" y1="${p.label[1]}" x2="${p.anchor[0]}" y2="${p.anchor[1]}"/><circle cx="${p.label[0]}" cy="${p.label[1]}" r="${R}"/><text x="${p.label[0]}" y="${p.label[1]}">${i + 1}</text></g>`;
  });
  return `<svg class="${thumb ? "thumb" : "draw" + (S.animate ? " anim" : "")}" viewBox="${s.vb}" role="img" aria-label="Schema ${esc(s.nome)}">${s.base}${parts}${marks}</svg>`;
}

function viewSchema() {
  const v = veicoli.get(S.vid), s = SYS[S.sys];

  }).join("");
  return `
  ${vehStrip(v)}
  <div class="head"><div><div class="eyebrow">${S.sys === "panoramica" ? "Vista d'insieme" : (s.campo ? "Manutenzione" : "Manuale di riparazione") + " · foglio " + idx + "/" + ORDER.length}</div><h1>${esc(s.nome)}</h1>
  <p>Tocca un pezzo sul disegno o una riga della tabella.</p></div></div>
  ${v.demo ? `<div class="banner"><b>Veicolo di esempio.</b> Valori inventati, solo per prova.</div>` : ""}

function srcList(c) {

/* ---------- backup ---------- */
function exportBackup() {
  const data = JSON.stringify({ app: "manuale-coppie", versione: 1, esportato: new Date().toISOString(), veicoli: Object.fromEntries(veicoli), coppie: Object.fromEntries(coppie) }, null, 1);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([data], { type: "application/json" }));
  a.download = "manuale-coppie-backup-" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast("Backup esportato");
}
document.getElementById("imp").addEventListener("change", async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = "";
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || typeof d !== "object" || typeof d.veicoli !== "object" || typeof d.coppie !== "object") throw new Error("formato");
    veicoli = new Map([...veicoli, ...Object.entries(d.veicoli)]);
    coppie = new Map([...coppie, ...Object.entries(d.coppie)]);
    localSave(); render();
    toast(`Backup importato: ${Object.keys(d.veicoli).length} veicoli, ${Object.keys(d.coppie).length} valori`);
  } catch (err) { toast("File non valido: scegli un backup esportato da questa app."); }
});

function errMsg(e) {
  const code = e && e.code;
  if (code === "permission_denied" || code === "not_granted" || code === "forbidden") return "Non hai i permessi per modificare questo archivio.";
  return (e && e.message) ? e.message : "Errore sconosciuto.";
}

    case "home": S.marca = null; S.vid = null; S.sys = null; S.part = null; go("marche"); break;
    case "go":
      if (d.to === "marche") { S.marca = null; S.vid = null; S.sys = null; S.part = null; }
      if (d.to === "modelli") { S.vid = null; S.sys = null; S.part = null; }
      if (d.to === "sistemi") { S.sys = null; S.part = null; }
      go(d.to); break;
    case "marca": S.marca = d.v; S.q = ""; go("modelli"); break;
    case "veicolo": S.vid = d.v; if (d.m) S.marca = d.m; go("sistemi"); break;
    case "sistema": S.sys = d.v; S.part = null; Z.k = 1; Z.x = 0; Z.y = 0; S.animate = true; go("schema"); break;
    case "modulo":
      if (d.v === "panoramica") { S.sys = "panoramica"; S.part = null; Z.k = 1; Z.x = 0; Z.y = 0; S.animate = true; go("schema"); }
      else if (d.v === "manutenzione") { S.sys = "tagliando"; S.part = null; Z.k = 1; Z.x = 0; Z.y = 0; S.animate = true; go("schema"); }
      else if (d.v === "dati") go("dati");
      else if (d.v === "scheda") go("scheda");
      else if (d.v === "funzioni") go("funzioni");
      else { const el = document.getElementById("manuali"); if (el) el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth", block: "start" }); }
      break;
    case "dato": S.sys = d.s; S.part = d.v; Z.k = 1; Z.x = 0; Z.y = 0; S.animate = true; if (S.view === "shell") { S.page = null; S.more = false; S.editing = false; render(); } else go("schema"); break;
    case "tab": S.sys = d.v; S.part = null; S.more = false; S.editing = false; Z.k = 1; Z.x = 0; Z.y = 0; S.animate = true; render(); break;
    case "menu": S.menu = !S.menu; render(); break;
    case "page": S.page = d.v; S.menu = false; render(); break;
    case "page-close": S.page = null; render(); break;
    case "more": S.more = true; if (!val(S.vid, S.sys, S.part)) { const c = {}; S.draft = { procedura: "", coppia: "", fasi: "", fonte: "", note: "" }; S.editing = true; } render(); break;
    case "close-part": S.part = null; S.more = false; S.editing = false; render(); break;
    case "zoom-in": zoomMid(1.5); break;
    case "zoom-out": zoomMid(1 / 1.5); break;
    case "zoom-reset": Z.k = 1; Z.x = 0; Z.y = 0; applyZoom(); break;
    case "export": exportBackup(); break;
    case "import": document.getElementById("imp").click(); break;
    case "part": {
      S.part = d.v; S.editing = false; S.more = false; S.confirmDel = false; S.error = ""; render();
      if (S.view !== "shell" && window.matchMedia("(max-width:880px)").matches) { const sd = document.getElementById("side"); if (sd) sd.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth", block: "start" }); }
      break;
    }
    case "edit": {
      const c = val(S.vid, S.sys, S.part) || {};
      S.draft = { procedura: c.procedura || "", coppia: c.coppia || "", fasi: c.fasi || "", fonte: c.esempio ? "" : (c.fonte || ""), note: c.note || "" };
      S.editing = true; S.more = true; S.error = ""; render();
      const f = document.getElementById("f-coppia"); if (f) f.focus();
      break;
    }
    case "cancel": S.editing = false; S.more = !!val(S.vid, S.sys, S.part); S.error = ""; render(); break;
    case "save": {
      const dd = S.draft, coppia = (dd.coppia || "").trim(), fonte = (dd.fonte || "").trim();
      if (!coppia) { S.error = SYS[S.sys].campo ? "Scrivi la specifica." : "Scrivi la coppia di serraggio."; render(); return; }
      if (!fonte) { S.error = "Indica la fonte del valore."; render(); return; }
      if (!store.ok) return;
      S.saving = true; S.error = ""; render();
      try {
        await store.set("coppie", key(S.vid, ...refOf(S.sys, S.part)), { veicoloId: S.vid, schema: refOf(S.sys, S.part)[0], punto: refOf(S.sys, S.part)[1], coppia, fasi: (dd.fasi || "").trim(), procedura: (dd.procedura || "").trim(), fonte, note: (dd.note || "").trim(), esempio: false, aggiornato: new Date().toISOString() });
        S.editing = false; toast("Valore salvato");
      } catch (e) { S.error = "Non salvato. " + errMsg(e); }
      S.saving = false; render(); break;
    }
    case "step": if (DONE.has(d.v)) DONE.delete(d.v); else DONE.add(d.v); render(); break;
    case "del-ask": S.confirmDel = true; render(); break;
    case "del-no": S.confirmDel = false; render(); break;
    case "del-yes": {
      if (!store.ok) return;
      try { await store.del("coppie", key(S.vid, ...refOf(S.sys, S.part))); toast("Valore eliminato"); }
      catch (e) { toast("Non eliminato. " + errMsg(e)); }
      S.confirmDel = false; render(); break;
    }
    case "add-open": S.adding = true; S.vdraft = {}; S.verror = ""; render(); { const f = document.getElementById("v-modello"); if (f) { f.focus(); f.scrollIntoView({ block: "center" }); } } break;
    case "add-cancel": S.adding = false; S.verror = ""; render(); break;
    case "add-save": {
      const v = S.vdraft, modello = (v.modello || "").trim();
      if (!modello) { S.verror = "Scrivi il nome del modello."; render(); return; }
      if (!store.ok) return;
      S.saving = true; render();
      try {
        const ref = { id: await store.add("veicoli", { marca: S.marca, modello, serie: (v.serie || "").trim(), motore: (v.motore || "").trim(), anni: (v.anni || "").trim(), demo: false, creato: new Date().toISOString() }) };
        S.adding = false; S.saving = false; S.vid = ref.id; toast("Modello aggiunto"); go("sistemi");
      } catch (e) { S.saving = false; S.verror = "Non salvato. " + errMsg(e); render(); }
      break;
    }
    case "vdel-ask": S.confirmVDel = true; render(); break;
    case "vdel-no": S.confirmVDel = false; render(); break;
    case "vdel-yes": {
      if (!store.ok) return;
      const vid = S.vid;
      try {
        for (const [id, c] of [...coppie.entries()]) if (c.veicoloId === vid) await store.del("coppie", id);
        await store.del("veicoli", vid);
        toast("Veicolo eliminato"); S.vid = null; go("modelli");
      } catch (e) { toast("Non eliminato. " + errMsg(e)); S.confirmVDel = false; render(); }
      break;
    }
  }
}

document.addEventListener("click", e => {
  if (suppressClick) { suppressClick = false; return; }
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  act(el.dataset.act, el.dataset);
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const el = e.target.closest && e.target.closest("[data-act][tabindex]");
  if (!el || el.tagName === "BUTTON") return;
  e.preventDefault(); act(el.dataset.act, el.dataset);
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "q-marca") { S.q = t.value; render(); return; }
  if (t.id === "q-dati") { S.dq = t.value; render(); return; }
  if (t.id === "q-funz") { S.fq = t.value; render(); return; }
  if (t.id === "only-filled") { S.onlyFilled = t.checked; render(); return; }
  if (t.dataset && t.dataset.draft) S[t.dataset.draft][t.dataset.k] = t.value;
});

/* ---------- archivio ---------- */
const LS_KEY = "manuale-coppie-v1";
const store = {
  ok: false, mode: null,
  async set(col, id, data) { if (this.mode === "db") return db.collection(col).doc(id).set(data); localPut(col, id, data); },
  async del(col, id) { if (this.mode === "db") return db.collection(col).doc(id).delete(); localPut(col, id, null); },
  async add(col, data) {
    if (this.mode === "db") return (await db.collection(col).add(data)).id;
    const id = "v" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    localPut(col, id, data); return id;
  }
};
let seedVersion = 0;
function localSave() {
  try { localStorage.setItem(LS_KEY, JSON.stringify({ seedVersion, veicoli: Object.fromEntries(veicoli), coppie: Object.fromEntries(coppie) })); return true; }
  catch (e) { return false; }
}
function localPut(col, id, data) {
  const m = new Map(col === "veicoli" ? veicoli : coppie);
  if (data) m.set(id, data); else m.delete(id);
  if (col === "veicoli") veicoli = m; else coppie = m;
  if (!localSave()) toast("Memoria del dispositivo non disponibile: esporta un backup per non perdere i dati.");
  render();
}
function localInit() {
  let data = null;
  try { data = JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch (e) { data = null; }
  const seed = window.SEED_DATA || { versione: 0, veicoli: {}, coppie: {} };
  if (!data) data = { seedVersion: 0, veicoli: {}, coppie: {} };
  veicoli = new Map(Object.entries(data.veicoli || {}));
  coppie = new Map(Object.entries(data.coppie || {}));
  seedVersion = data.seedVersion || 0;
  /* nuove macchine e valori arrivati con un aggiornamento: si aggiungono, senza toccare quello che hai inserito tu */
  let added = 0;
  if ((seed.versione || 0) > seedVersion) {
    for (const [id, v] of Object.entries(seed.veicoli || {})) if (!veicoli.has(id)) { veicoli.set(id, v); added++; }
    for (const [id, c] of Object.entries(seed.coppie || {})) if (!coppie.has(id)) coppie.set(id, c);
    for (const id of seed.rimuovi || []) { veicoli.delete(id); for (const k of [...coppie.keys()]) if (coppie.get(k).veicoloId === id) coppie.delete(k); }
    const hadData = seedVersion > 0;
    seedVersion = seed.versione || 0;
    if (hadData && added) setTimeout(() => toast(`Aggiornamento: ${added} nuovi veicoli disponibili`), 600);
  }
  localSave();
  store.ok = true; store.mode = "local"; dbStatus = "local"; render();
}
function ready() {
  if (got.v && got.c && dbStatus !== "ok") { dbStatus = "ok"; clearTimeout(slowTimer); }
}
async function connect() {
  if (!(window.claude && typeof window.claude.use === "function")) { localInit(); return; }
  try { db = await window.claude.use("db"); } catch (e) { db = null; }
  if (!db) { dbStatus = "off"; render(); return; }
  store.ok = true; store.mode = "db";
  slowTimer = setTimeout(() => { if (dbStatus === "loading") { dbStatus = "slow"; render(); } }, 10000);
  const fail = () => { dbStatus = "error"; clearTimeout(slowTimer); render(); };
  db.collection("veicoli").onSnapshot(s => {
    const m = new Map(); s.docs.forEach(d => m.set(d.id, d.data())); veicoli = m;
    if (!s.metadata.fromCache) got.v = true; ready(); render();
  }, fail);
  db.collection("coppie").onSnapshot(s => {
    const m = new Map(); s.docs.forEach(d => m.set(d.id, d.data())); coppie = m;
    if (!s.metadata.fromCache) got.c = true; ready(); render();
  }, fail);
}

if (V3D.ok) V3D.onPick = id => act("part", { v: id });
render();
connect();
let lastNarrow = NARROW();
window.addEventListener("resize", () => { const n = NARROW(); if (n !== lastNarrow) { lastNarrow = n; render(); } });
})();
</script>
